<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Display – Screen 4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #555;
      font-family: sans-serif;
      text-align: center;
      gap: 16px;
    }

    #placeholder .icon { font-size: 64px; }
    #placeholder h1 { font-size: 2rem; color: #666; font-weight: 400; }
    #placeholder p { font-size: 1rem; color: #444; max-width: 400px; line-height: 1.6; }
    #placeholder code {
      background: #222;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Two slide layers for crossfade -->
  <div class="slide" id="slide-a"><img id="img-a" src="" alt="Menu" /></div>
  <div class="slide" id="slide-b"><img id="img-b" src="" alt="Menu" /></div>

  <div id="placeholder" style="display:none;">
    <div class="icon">🍽️</div>
    <h1>Screen 4</h1>
    <p>Add images named <code>menu1.jpg</code>, <code>menu2.jpg</code>, and <code>menu3.jpg</code> to this folder.</p>
    <p>They will cycle automatically with a fade transition.</p>
  </div>

  <script>
    // ─── Configuration ────────────────────────────────────────────────
    // The images to cycle through (must be in the screen4/ folder)
    const IMAGES = [
      '../screen1/menu.jpg',
      '../screen2/menu.jpg',
      '../screen3/menu.jpg'
    ];

    // How long each image is shown (milliseconds). Default: 8 seconds.
    const DISPLAY_DURATION = 8000;

    // How often to re-check for updated images (milliseconds). Default: 5 minutes.
    const REFRESH_INTERVAL = 5 * 60 * 1000;
    // ─────────────────────────────────────────────────────────────────

    const slideA = document.getElementById('slide-a');
    const slideB = document.getElementById('slide-b');
    const imgA   = document.getElementById('img-a');
    const imgB   = document.getElementById('img-b');
    const placeholder = document.getElementById('placeholder');

    let currentIndex = 0;
    let activeSlide = 'a'; // which layer is currently visible
    let loadedImages = [];  // successfully loaded image URLs

    // Pre-load all images, collecting the ones that exist
    function preloadImages(callback) {
      const loaded = [];
      let remaining = IMAGES.length;

      IMAGES.forEach((src) => {
        const t = new Image();
        const bust = src + '?v=' + Date.now();
        t.onload  = () => { loaded.push(bust); check(); };
        t.onerror = () => { check(); };
        t.src = bust;
      });

      function check() {
        remaining--;
        if (remaining === 0) callback(loaded);
      }
    }

    function showSlide(src) {
      if (activeSlide === 'a') {
        // Load next image into B, then fade B in and A out
        imgB.src = src;
        slideB.classList.add('active');
        slideA.classList.remove('active');
        activeSlide = 'b';
      } else {
        imgA.src = src;
        slideA.classList.add('active');
        slideB.classList.remove('active');
        activeSlide = 'a';
      }
    }

    function startCycle() {
      if (loadedImages.length === 0) {
        placeholder.style.display = 'flex';
        return;
      }

      placeholder.style.display = 'none';

      // Show first image immediately
      imgA.src = loadedImages[0];
      slideA.classList.add('active');
      activeSlide = 'a';
      currentIndex = 1;

      setInterval(() => {
        if (loadedImages.length === 0) return;
        showSlide(loadedImages[currentIndex % loadedImages.length]);
        currentIndex++;
      }, DISPLAY_DURATION);
    }

    // Periodically reload images in the background to pick up changes
    function scheduleRefresh() {
      setInterval(() => {
        preloadImages((fresh) => {
          if (fresh.length > 0) loadedImages = fresh;
        });
      }, REFRESH_INTERVAL);
    }

    // Kick everything off
    preloadImages((images) => {
      loadedImages = images;
      startCycle();
      scheduleRefresh();
    });
  </script>

</body>
</html>
